<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV 위치 데이터 지도 시각화 도구</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS & JS (Stable Public CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- Leaflet MarkerCluster CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
    
    <!-- PapaParse for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        #map {
            height: 100%;
            min-height: 480px;
            z-index: 10;
            background-color: #f1f5f9;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .leaflet-control-layers {
            border-radius: 0.75rem !important;
            border: 1px solid #e2e8f0 !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1) !important;
            padding: 8px 12px !important;
            font-size: 12px !important;
        }
        /* Remove Leaflet default square borders on custom icons */
        .leaflet-div-icon {
            background: transparent !important;
            border: none !important;
        }
        .custom-cluster-icon {
            background: transparent !important;
            border: none !important;
        }
        /* Pulse animation for active marker */
        @keyframes markerPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { transform: scale(1.2); box-shadow: 0 0 0 14px rgba(245, 158, 11, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
        .solar-pin-active {
            animation: markerPulse 1.8s infinite;
            z-index: 1000 !important;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen overflow-hidden">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 text-white px-6 py-3.5 flex flex-wrap items-center justify-between border-b border-slate-800 shadow-md z-30">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-amber-500 text-slate-950 rounded-lg shadow-inner">
                <i data-lucide="sun" class="w-5 h-5"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight flex items-center gap-2">
                    CSV 위치 데이터 지도 시각화
                    <span class="text-[10px] font-normal bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full">실시간 마커 연동</span>
                </h1>
                <p class="text-xs text-slate-400">태양광발전소 사업현황 및 위도·경도 좌표 지도 시각화 도구</p>
            </div>
        </div>

        <div class="flex items-center space-x-2 mt-2 sm:mt-0">
            <button id="loadPresetBtn" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold rounded-lg text-xs shadow-md transition flex items-center gap-1.5">
                <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                <span>예시 데이터 다시 불러오기</span>
            </button>
            <button id="resetAppBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-medium transition flex items-center gap-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                <span>초기화</span>
            </button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

        <!-- Left Sidebar: Controls & Data Table -->
        <aside class="w-full lg:w-96 bg-white border-r border-slate-200 flex flex-col z-20 shadow-lg shrink-0 max-h-1/2 lg:max-h-full">
            
            <!-- Upload Box Section -->
            <div class="p-4 border-b border-slate-100 bg-slate-50/50 space-y-3">
                <div id="dropZone" class="border-2 border-dashed border-slate-300 hover:border-amber-500 bg-white hover:bg-amber-50/30 rounded-xl p-3.5 text-center transition cursor-pointer group">
                    <input type="file" id="csvFileInput" accept=".csv, .txt" class="hidden">
                    <div class="flex flex-col items-center justify-center space-y-1">
                        <div class="w-9 h-9 rounded-full bg-amber-100 group-hover:bg-amber-200 text-amber-600 flex items-center justify-center transition">
                            <i data-lucide="upload-cloud" class="w-5 h-5"></i>
                        </div>
                        <p class="text-xs font-semibold text-slate-700">내 CSV 파일 업로드하기</p>
                        <p class="text-[11px] text-slate-400">파일을 끌어다 놓거나 클릭하세요 (위도/경도 자동인식)</p>
                    </div>
                </div>

                <!-- Encoding Selector Option -->
                <div class="flex items-center justify-between text-xs text-slate-600 pt-0.5">
                    <label for="encodingSelect" class="flex items-center gap-1 font-medium text-slate-500">
                        <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 한글 인코딩:
                    </label>
                    <select id="encodingSelect" class="bg-white border border-slate-200 rounded-md px-2 py-1 text-xs focus:ring-1 focus:ring-amber-500 outline-none">
                        <option value="EUC-KR" selected>EUC-KR / CP949 (공공데이터 기본)</option>
                        <option value="UTF-8">UTF-8</option>
                    </select>
                </div>
            </div>

            <!-- Column Selector Panel -->
            <div id="columnConfigPanel" class="p-3 border-b border-slate-100 bg-amber-50/40 space-y-2.5">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
                        <i data-lucide="sliders" class="w-3.5 h-3.5 text-amber-600"></i> 좌표 컬럼 매핑
                    </span>
                    <span id="rowCountBadge" class="text-[10px] font-bold bg-amber-500 text-slate-950 px-2 py-0.5 rounded-full">0 건 데이터</span>
                </div>
                
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div>
                        <label class="block text-[10px] text-slate-500 font-medium mb-0.5">위도 (Y축 / Latitude)</label>
                        <select id="latColumnSelect" class="w-full bg-white border border-slate-200 rounded-md p-1.5 text-xs outline-none focus:border-amber-500 text-slate-700 font-medium">
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 font-medium mb-0.5">경도 (X축 / Longitude)</label>
                        <select id="lngColumnSelect" class="w-full bg-white border border-slate-200 rounded-md p-1.5 text-xs outline-none focus:border-amber-500 text-slate-700 font-medium">
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] text-slate-500 font-medium mb-0.5">팝업 제목 컬럼</label>
                    <select id="titleColumnSelect" class="w-full bg-white border border-slate-200 rounded-md p-1.5 text-xs outline-none focus:border-amber-500 text-slate-700">
                    </select>
                </div>
            </div>

            <!-- Data Search & Filter Section -->
            <div class="flex-1 flex flex-col min-h-0 bg-white">
                <div class="p-2.5 border-b border-slate-100 space-y-2">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="searchInput" placeholder="발전소명, 주소, 사업자 검색..." class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:bg-white focus:ring-1 focus:ring-amber-500 outline-none transition">
                    </div>

                    <!-- Capacity Quick Filter Pills -->
                    <div class="flex items-center gap-1 overflow-x-auto pb-0.5 text-[11px]" id="capacityFilterContainer">
                        <button data-filter="all" class="cap-filter-btn px-2 py-1 bg-amber-500 text-slate-950 font-bold rounded-md shrink-0">전체</button>
                        <button data-filter="small" class="cap-filter-btn px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-md shrink-0">100kW 미만</button>
                        <button data-filter="medium" class="cap-filter-btn px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-md shrink-0">100~300kW</button>
                        <button data-filter="large" class="cap-filter-btn px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-md shrink-0">300kW 이상</button>
                    </div>
                </div>

                <!-- Record List Container -->
                <div id="dataListContainer" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                </div>
            </div>
            
            <!-- Toast Notification Box -->
            <div id="toast" class="hidden mx-4 mb-3 p-2.5 bg-slate-900 text-white rounded-lg text-xs flex items-center justify-between shadow-lg transition-all duration-300 z-50">
                <span id="toastMsg" class="truncate pr-2">알림 메세지</span>
                <button onclick="hideToast()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            </div>
        </aside>

        <!-- Right Area: Map Visualization -->
        <main class="flex-1 relative bg-slate-100 flex flex-col">
            
            <!-- Floating Map Statistics Dashboard -->
            <div class="absolute top-4 left-4 z-20 flex flex-col items-start gap-2 pointer-events-none max-w-sm">
                <div class="bg-slate-900/90 backdrop-blur-md text-white px-4 py-3 rounded-2xl shadow-xl border border-slate-700/60 pointer-events-auto flex flex-col gap-2 w-full">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
                            <span class="text-xs font-semibold text-slate-200">지도 표시 위치 현황</span>
                        </div>
                        <span id="mapStatsBadge" class="text-[11px] font-bold text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded-full border border-amber-400/20">
                            총 <span id="validMarkerCount">0</span>개 발전소
                        </span>
                    </div>

                    <div class="grid grid-cols-2 gap-3 text-xs pt-0.5">
                        <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700/50">
                            <div class="text-[10px] text-slate-400 mb-0.5">총 설비 용량</div>
                            <div class="text-sm font-extrabold text-amber-400 flex items-baseline gap-1">
                                <span id="totalCapacityVal">0</span>
                                <span class="text-[10px] font-normal text-slate-300">kW</span>
                            </div>
                        </div>
                        <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700/50">
                            <div class="text-[10px] text-slate-400 mb-0.5">평균 설비 용량</div>
                            <div class="text-sm font-extrabold text-emerald-400 flex items-baseline gap-1">
                                <span id="avgCapacityVal">0</span>
                                <span class="text-[10px] font-normal text-slate-300">kW</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Leaflet Map Container -->
            <div id="map" class="w-full h-full"></div>
        </main>
    </div>

    <!-- JavaScript Implementation -->
    <script>
        // Global State
        let map = null;
        let markerClusterGroup = null;
        let rawCsvData = [];
        let parsedRecords = [];
        let mapMarkersMap = new Map();
        let selectedRecordId = null;
        let currentCapacityFilter = 'all';

        // Auto-detection Column Keyword Lists
        const LAT_KEYWORDS = ['위도', 'lat', 'latitude', 'y좌표', 'y', 'y_coord'];
        const LNG_KEYWORDS = ['경도', 'lng', 'lon', 'longitude', 'x좌표', 'x', 'x_coord'];
        const TITLE_KEYWORDS = ['발전소명', '사업자명', '상호', '명칭', '이름', '제목', 'title', 'name', '소재지도로명주소', '주소'];

        // Sample Solar Power Plant Dataset (경상남도 거제시)
        const MOCK_GEOJE_SOLAR_CSV = `발전소명,사업자명,소재지도로명주소,설비용량(kW),위도,경도,허가일자
거제장목 태양광발전소 1호,거제소형에너지(주),경상남도 거제시 장목면 거제북로 1020,99.8,34.9812,128.6654,2023-01-15
사등 해맞이 태양광발전소,사등에너지,경상남도 거제시 사등면 가조로 145,198.5,34.9123,128.5621,2022-11-04
일운 동해 햇빛발전소,일운발전,경상남도 거제시 일운면 지세포해안로 88,49.5,34.8315,128.7123,2023-03-20
거제상문 그린솔라 1호기,상문태양광,경상남도 거제시 상동5길 22,350.0,34.8721,128.6251,2021-08-10
동부 산양 햇빛발전소,동부솔라,경상남도 거제시 동부면 거제남서로 2100,99.0,34.8210,128.5890,2023-05-12
남부 갈곶 햇살발전소,남부발전,경상남도 거제시 남부면 다대길 45,120.0,34.7312,128.6012,2022-04-18
연초 한내 공장 지붕태양광,한내산업,경상남도 거제시 연초면 한내공단길 55,480.0,34.9351,128.6412,2020-12-01
옥포 솔라파크,옥포에너지,경상남도 거제시 옥포성안로 12,98.0,34.8912,128.6891,2023-07-02
장평 주민참여형 태양광,장평협동조합,경상남도 거제시 장평로 16,30.0,34.8881,128.6051,2023-09-11
거제면 서정 햇빛발전소,서정에너지,경상남도 거제시 거제면 읍내로 52,99.6,34.8541,128.5912,2022-02-14`;

        // Initialize App on DOM Loaded
        window.onload = function() {
            if (window.lucide) {
                lucide.createIcons();
            }
            initMap();
            setupEventListeners();

            // Automatically load Geoje sample dataset on start so markers appear immediately!
            loadGeojePresetData(true);
        };

        // Initialize Leaflet Map with 100% Free Esri Public Tile Servers (No API Key Required)
        function initMap() {
            const defaultLat = 34.8800;
            const defaultLng = 128.6211;

            map = L.map('map', {
                zoomControl: false
            }).setView([defaultLat, defaultLng], 11);

            // Add Zoom Control to Bottom-Right
            L.control.zoom({ position: 'bottomright' }).addTo(map);

            // 1. Esri World Street Map (API 키 무필요, 고해상도 지형)
            const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, USGS, NOAA'
            });

            // 2. Esri World Topo Map (지형 지도)
            const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri'
            });

            // 3. Esri World Imagery (위성 지도)
            const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri'
            });

            // Apply Default Tile Layer
            esriStreet.addTo(map);

            // Layer Switcher in Top-Right
            const baseMaps = {
                "Esri 일반 지도 (기본)": esriStreet,
                "Esri 지형 지도": esriTopo,
                "Esri 위성 지도": esriSatellite
            };
            L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

            // Marker Cluster Group setup with custom badge styling
            markerClusterGroup = L.markerClusterGroup({
                showCoverageOnHover: false,
                maxClusterRadius: 40,
                iconCreateFunction: function(cluster) {
                    const childCount = cluster.getChildCount();
                    let colorClass = 'bg-amber-500 text-slate-950 border-2 border-white shadow-lg font-bold';
                    let sizeClass = 'w-9 h-9 text-xs';

                    if (childCount > 30) {
                        colorClass = 'bg-amber-600 text-white border-2 border-white shadow-xl font-extrabold';
                        sizeClass = 'w-11 h-11 text-sm';
                    } else if (childCount > 10) {
                        colorClass = 'bg-amber-500 text-slate-950 border-2 border-white shadow-lg font-extrabold';
                        sizeClass = 'w-10 h-10 text-xs';
                    }

                    return L.divIcon({
                        html: `<div class="rounded-full flex items-center justify-center ${colorClass} ${sizeClass}">${childCount}</div>`,
                        className: 'custom-cluster-icon',
                        iconSize: L.point(40, 40)
                    });
                }
            });

            map.addLayer(markerClusterGroup);
        }

        function setupEventListeners() {
            const dropZone = document.getElementById('dropZone');
            const csvFileInput = document.getElementById('csvFileInput');

            dropZone.addEventListener('click', () => csvFileInput.click());
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-amber-500', 'bg-amber-50/50');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-amber-500', 'bg-amber-50/50');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-amber-500', 'bg-amber-50/50');
                if (e.dataTransfer.files.length > 0) {
                    handleFileSelect(e.dataTransfer.files[0]);
                }
            });

            csvFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFileSelect(e.target.files[0]);
                }
            });

            document.getElementById('latColumnSelect').addEventListener('change', renderMarkersAndList);
            document.getElementById('lngColumnSelect').addEventListener('change', renderMarkersAndList);
            document.getElementById('titleColumnSelect').addEventListener('change', renderMarkersAndList);

            document.getElementById('searchInput').addEventListener('input', handleSearchAndFilter);
            document.getElementById('loadPresetBtn').addEventListener('click', () => loadGeojePresetData(false));
            document.getElementById('resetAppBtn').addEventListener('click', resetApp);

            // Capacity Filter Buttons
            const filterContainer = document.getElementById('capacityFilterContainer');
            filterContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.cap-filter-btn');
                if (!btn) return;

                filterContainer.querySelectorAll('.cap-filter-btn').forEach(b => {
                    b.className = 'cap-filter-btn px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-md shrink-0';
                });
                btn.className = 'cap-filter-btn px-2 py-1 bg-amber-500 text-slate-950 font-bold rounded-md shrink-0';

                currentCapacityFilter = btn.dataset.filter;
                handleSearchAndFilter();
            });
        }

        function handleFileSelect(file) {
            if (!file.name.toLowerCase().endsWith('.csv') && !file.name.toLowerCase().endsWith('.txt')) {
                showToast('CSV 또는 TXT 확장자 파일만 업로드할 수 있습니다.');
                return;
            }

            const encoding = document.getElementById('encodingSelect').value;
            const reader = new FileReader();

            reader.onload = function(e) {
                const buffer = e.target.result;
                const decoder = new TextDecoder(encoding);
                const textContent = decoder.decode(buffer);

                parseCsvText(textContent, file.name);
            };

            reader.onerror = function() {
                showToast('파일을 읽는 도중 오류가 발생했습니다.');
            };

            reader.readAsArrayBuffer(file);
        }

        function parseCsvText(csvText, filename = '') {
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                dynamicTyping: false,
                complete: function(results) {
                    if (!results.data || results.data.length === 0) {
                        showToast('CSV 파일에 유효한 데이터가 존재하지 않습니다.');
                        return;
                    }

                    rawCsvData = results.data;
                    const headers = results.meta.fields || Object.keys(rawCsvData[0] || {});

                    if (headers.length < 2) {
                        showToast('유효한 CSV 컬럼 구분이 아닙니다.');
                        return;
                    }

                    populateColumnSelectors(headers);
                    document.getElementById('rowCountBadge').textContent = `${rawCsvData.length.toLocaleString()} 건 데이터`;

                    if (filename) {
                        showToast(`${filename} 데이터가 로드되었습니다.`);
                    }
                    
                    renderMarkersAndList();
                },
                error: function(err) {
                    showToast('CSV 파싱 오류: ' + err.message);
                }
            });
        }

        function populateColumnSelectors(headers) {
            const latSelect = document.getElementById('latColumnSelect');
            const lngSelect = document.getElementById('lngColumnSelect');
            const titleSelect = document.getElementById('titleColumnSelect');

            latSelect.innerHTML = '';
            lngSelect.innerHTML = '';
            titleSelect.innerHTML = '';

            let detectedLat = '';
            let detectedLng = '';
            let detectedTitle = '';

            headers.forEach(h => {
                const lowerH = h.trim().toLowerCase();
                
                latSelect.add(new Option(h, h));
                lngSelect.add(new Option(h, h));
                titleSelect.add(new Option(h, h));

                if (!detectedLat && LAT_KEYWORDS.some(k => lowerH.includes(k))) detectedLat = h;
                if (!detectedLng && LNG_KEYWORDS.some(k => lowerH.includes(k))) detectedLng = h;
                if (!detectedTitle && TITLE_KEYWORDS.some(k => lowerH.includes(k))) detectedTitle = h;
            });

            latSelect.value = detectedLat || headers[0];
            lngSelect.value = detectedLng || headers[1] || headers[0];
            titleSelect.value = detectedTitle || headers[0];
        }

        function renderMarkersAndList() {
            if (!rawCsvData || rawCsvData.length === 0) return;

            const latCol = document.getElementById('latColumnSelect').value;
            const lngCol = document.getElementById('lngColumnSelect').value;
            const titleCol = document.getElementById('titleColumnSelect').value;

            markerClusterGroup.clearLayers();
            mapMarkersMap.clear();

            parsedRecords = [];
            let validCount = 0;
            let totalCapSum = 0;
            const latLngBounds = [];

            rawCsvData.forEach((row, idx) => {
                const rawLat = parseFloat(row[latCol]);
                const rawLng = parseFloat(row[lngCol]);
                const titleVal = row[titleCol] || `데이터 #${idx + 1}`;

                // Try to find capacity column
                let capValue = 0;
                const capKey = Object.keys(row).find(k => k.includes('용량') || k.includes('kW') || k.toLowerCase().includes('capacity'));
                if (capKey && !isNaN(parseFloat(row[capKey]))) {
                    capValue = parseFloat(row[capKey]);
                }

                const isValidCoords = !isNaN(rawLat) && !isNaN(rawLng) && rawLat >= -90 && rawLat <= 90 && rawLng >= -180 && rawLng <= 180;

                const record = {
                    id: idx,
                    title: titleVal,
                    lat: rawLat,
                    lng: rawLng,
                    capacity: capValue,
                    isValid: isValidCoords,
                    rawData: row
                };

                parsedRecords.push(record);

                if (isValidCoords) {
                    validCount++;
                    totalCapSum += capValue;
                    const latLng = [rawLat, rawLng];
                    latLngBounds.push(latLng);

                    // Custom Solar Pin DivIcon HTML
                    const customPinIcon = L.divIcon({
                        className: 'custom-pin-icon',
                        html: `
                            <div id="pin-marker-${idx}" class="relative group cursor-pointer transform transition-transform hover:scale-110">
                                <div class="flex items-center gap-1.5 bg-slate-900 text-white px-2.5 py-1 rounded-full shadow-lg border-2 border-amber-400">
                                    <div class="w-4 h-4 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center shrink-0">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                                    </div>
                                    <span class="text-[11px] font-bold text-amber-300 truncate max-w-[100px]">${escapeHtml(titleVal)}</span>
                                    ${capValue > 0 ? `<span class="text-[10px] font-semibold bg-amber-500/20 text-amber-300 px-1.5 py-0.2 rounded">${capValue}kW</span>` : ''}
                                </div>
                            </div>
                        `,
                        iconSize: [160, 32],
                        iconAnchor: [80, 16],
                        popupAnchor: [0, -16]
                    });

                    // Build Popup Content HTML
                    let popupHtml = `
                        <div class="p-2 space-y-2 max-w-xs font-sans text-xs">
                            <div class="font-bold text-slate-900 border-b border-slate-200 pb-1.5 text-sm flex items-center justify-between">
                                <span class="flex items-center gap-1.5 text-slate-900">
                                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                                    ${escapeHtml(titleVal)}
                                </span>
                            </div>
                            <div class="space-y-1 text-slate-600 max-h-48 overflow-y-auto divide-y divide-slate-100">`;

                    Object.keys(row).forEach(key => {
                        if (row[key] !== null && row[key] !== undefined && row[key] !== '') {
                            popupHtml += `
                                <div class="flex justify-between gap-2 py-1">
                                    <span class="font-semibold text-slate-500 shrink-0">${escapeHtml(key)}:</span>
                                    <span class="text-slate-800 text-right font-medium truncate">${escapeHtml(row[key].toString())}</span>
                                </div>`;
                        }
                    });

                    popupHtml += `
                            </div>
                            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
                                <span>좌표: ${rawLat.toFixed(4)}, ${rawLng.toFixed(4)}</span>
                                <button onclick="selectRecordFromMap(${idx})" class="text-amber-600 hover:underline font-bold">목록 하이라이트</button>
                            </div>
                        </div>`;

                    const marker = L.marker(latLng, { icon: customPinIcon });
                    marker.bindPopup(popupHtml, { maxWidth: 320 });

                    marker.on('click', () => {
                        highlightRecordInList(idx);
                    });

                    markerClusterGroup.addLayer(marker);
                    mapMarkersMap.set(idx, marker);
                }
            });

            // Update Header Stats Dashboard
            document.getElementById('validMarkerCount').textContent = validCount.toLocaleString();
            document.getElementById('totalCapacityVal').textContent = totalCapSum.toLocaleString(undefined, { maximumFractionDigits: 1 });
            document.getElementById('avgCapacityVal').textContent = validCount > 0 ? (totalCapSum / validCount).toFixed(1) : '0';

            // Fit map bounds to show all markers
            if (latLngBounds.length > 0) {
                map.fitBounds(latLngBounds, { padding: [50, 50], maxZoom: 14 });
            }

            handleSearchAndFilter();
        }

        function handleSearchAndFilter() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();

            const filtered = parsedRecords.filter(item => {
                // Capacity filter condition
                if (currentCapacityFilter === 'small' && item.capacity >= 100) return false;
                if (currentCapacityFilter === 'medium' && (item.capacity < 100 || item.capacity > 300)) return false;
                if (currentCapacityFilter === 'large' && item.capacity <= 300) return false;

                // Search query condition
                if (!query) return true;
                return Object.values(item.rawData).some(val => 
                    val !== null && val !== undefined && val.toString().toLowerCase().includes(query)
                );
            });

            renderRecordList(filtered);
        }

        function renderRecordList(recordsToRender) {
            const container = document.getElementById('dataListContainer');
            container.innerHTML = '';

            if (recordsToRender.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-400 space-y-1">
                        <i data-lucide="info" class="w-6 h-6 mx-auto text-slate-300 mb-1"></i>
                        <p class="text-xs font-medium">검색 또는 필터 조건에 부합하는 항목이 없습니다.</p>
                    </div>`;
                if (window.lucide) lucide.createIcons();
                return;
            }

            const titleCol = document.getElementById('titleColumnSelect').value;

            recordsToRender.forEach(item => {
                const isSelected = selectedRecordId === item.id;
                const div = document.createElement('div');
                div.id = `list-item-${item.id}`;
                div.className = `p-3 text-xs border-b border-slate-100 hover:bg-amber-50/60 cursor-pointer transition flex items-start justify-between gap-2 group ${isSelected ? 'bg-amber-100/70 border-l-4 border-l-amber-500' : ''}`;

                let detailAddress = '';
                const keys = Object.keys(item.rawData).filter(k => (k.includes('주소') || k.includes('소재지') || k.includes('사업자')) && item.rawData[k]);
                if (keys.length > 0) {
                    detailAddress = item.rawData[keys[0]];
                }

                div.innerHTML = `
                    <div class="space-y-1 flex-1 min-w-0">
                        <div class="font-bold text-slate-800 group-hover:text-amber-800 flex items-center justify-between">
                            <span class="truncate">${escapeHtml(item.title)}</span>
                            ${item.capacity > 0 ? `<span class="shrink-0 text-[10px] font-extrabold text-amber-700 bg-amber-200/80 px-1.5 py-0.5 rounded">${item.capacity} kW</span>` : ''}
                        </div>
                        ${detailAddress ? `<div class="text-[11px] text-slate-500 truncate">${escapeHtml(detailAddress)}</div>` : ''}
                        ${item.isValid ? `
                            <div class="text-[10px] text-slate-400 flex items-center gap-1 pt-0.5">
                                <i data-lucide="map-pin" class="w-3 h-3 text-amber-500"></i>
                                <span>위도 ${item.lat.toFixed(4)}, 경도 ${item.lng.toFixed(4)}</span>
                            </div>
                        ` : `
                            <div class="text-[10px] text-red-500 font-semibold">좌표 데이터 오류</div>
                        `}
                    </div>
                    <div class="shrink-0 text-slate-300 group-hover:text-amber-500 transition self-center">
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </div>
                `;

                div.addEventListener('click', () => {
                    selectRecordFromList(item);
                });

                container.appendChild(div);
            });

            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function selectRecordFromList(item) {
            if (!item.isValid) {
                showToast('유효한 위경도 좌표가 없는 항목입니다.');
                return;
            }

            selectedRecordId = item.id;
            highlightRecordInList(item.id);

            const marker = mapMarkersMap.get(item.id);
            if (marker) {
                markerClusterGroup.zoomToShowLayer(marker, () => {
                    map.flyTo([item.lat, item.lng], 16, { duration: 1 });
                    marker.openPopup();

                    // Apply pulse effect
                    const pinElem = document.getElementById(`pin-marker-${item.id}`);
                    if (pinElem) {
                        pinElem.classList.add('solar-pin-active');
                        setTimeout(() => pinElem.classList.remove('solar-pin-active'), 3600);
                    }
                });
            }
        }

        function highlightRecordInList(id) {
            selectedRecordId = id;
            document.querySelectorAll('#dataListContainer > div').forEach(el => {
                el.classList.remove('bg-amber-100/70', 'border-l-4', 'border-l-amber-500');
            });

            const targetItem = document.getElementById(`list-item-${id}`);
            if (targetItem) {
                targetItem.classList.add('bg-amber-100/70', 'border-l-4', 'border-l-amber-500');
                targetItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function selectRecordFromMap(id) {
            highlightRecordInList(id);
            showToast(`발전소 #${id + 1} 항목이 선택되었습니다.`);
        }

        function loadGeojePresetData(isInitial = false) {
            document.getElementById('encodingSelect').value = 'UTF-8';
            parseCsvText(MOCK_GEOJE_SOLAR_CSV, isInitial ? '' : '경상남도 거제시 태양광 예시 데이터');
            if (!isInitial) {
                showToast('경상남도 거제시 태양광발전소 예시 데이터가 로드되었습니다.');
            }
        }

        function resetApp() {
            rawCsvData = [];
            parsedRecords = [];
            selectedRecordId = null;
            markerClusterGroup.clearLayers();
            mapMarkersMap.clear();

            document.getElementById('csvFileInput').value = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('validMarkerCount').textContent = '0';
            document.getElementById('totalCapacityVal').textContent = '0';
            document.getElementById('avgCapacityVal').textContent = '0';

            document.getElementById('dataListContainer').innerHTML = `
                <div class="p-8 text-center text-slate-400 space-y-2">
                    <i data-lucide="file-spreadsheet" class="w-8 h-8 mx-auto text-slate-300"></i>
                    <p class="text-xs">CSV 파일을 업로드하면<br>목록과 지도가 시각화됩니다.</p>
                </div>`;

            map.setView([34.8800, 128.6211], 11);
            if (window.lucide) {
                lucide.createIcons();
            }
            showToast('초기화 되었습니다.');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.classList.remove('hidden');

            setTimeout(() => {
                hideToast();
            }, 3500);
        }

        function hideToast() {
            document.getElementById('toast').classList.add('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
